            <span class="eyebrow">WHY WE BUILT THIS</span>
            <h2>The first call decides everything. Most businesses lose it.</h2>
          </div>
          <div class="story-grid">
            <div class="card story-card">
              <strong>The problem</strong>
              <p>A lead goes cold within minutes of arriving. Sales teams are busy, follow-up gets delayed to "later today," and by evening the customer has already called a competitor. Hiring more telecallers is slow, expensive, and inconsistent — a good call one day, a rushed one the next.</p>
            </div>
            <div class="card story-card">
              <strong>The old fix, and why it falls short</strong>
              <p>Generic AI callers exist, but most sound robotic, only speak English well, and can't hold the kind of Telugu-English or Hindi-English conversation your customers actually have. Customers hang up before the pitch even starts.</p>
            </div>
            <div class="card story-card">
              <strong>What Swara does instead</strong>
              <p>Swara picks up the moment a lead arrives, speaks the caller's own language naturally, follows your exact script, and hands your team a booked meeting — not just a phone number that was dialled.</p>
            </div>
          </div>
        </section>

        <section class="how-it-works">
          <div class="section-head">
            <span class="eyebrow">HOW IT ACTUALLY WORKS</span>
            <h2>Under the hood, in plain English.</h2>
          </div>
          <div class="tech-steps">
            <div class="tech-step"><span class="tech-num">1</span><div><strong>A lead lands</strong><p>From an ad, form, spreadsheet, or your CRM — Swara picks it up instantly.</p></div></div>
            <div class="tech-step"><span class="tech-num">2</span><div><strong>The call connects</strong><p>Swara dials out over a standard phone line — no app required on the customer's end.</p></div></div>
            <div class="tech-step"><span class="tech-num">3</span><div><strong>Speech becomes text, in real time</strong><p>Built on Sarvam AI's speech models, tuned for Indian languages and accents.</p></div></div>
            <div class="tech-step"><span class="tech-num">4</span><div><strong>Swara decides what to say</strong><p>Following the exact script and rules you set — never improvising outside them.</p></div></div>
            <div class="tech-step"><span class="tech-num">5</span><div><strong>A natural voice replies</strong><p>Fast enough that the conversation feels like a real phone call, not a bot.</p></div></div>
            <div class="tech-step"><span class="tech-num">6</span><div><strong>The outcome is logged</strong><p>Transcript, summary, and next step land in your dashboard automatically.</p></div></div>
          </div>
        </section>
