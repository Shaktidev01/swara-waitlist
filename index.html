    <title>Swara — AI voice employee for Indian businesses</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <template id="header-template">
      <header class="nav">
        <a class="brand" href="index.html">

    <template id="footer-template">
      <footer class="site-footer">
        <div class="footer-top">
          <div class="brand">
            <span class="brand-mark" data-slot="brand-mark"></span>
            <div class="brand-text"><strong>Swara</strong><small>AI Voice Employee</small></div>

          <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>

          <span>Made in India</span>
          <span>© 2027 Swara AI</span>
        </div>
      </footer>

    <template id="page-template">
      <div class="page">
        <div data-slot="header"></div>

        <section class="hero" id="hero">
          <div class="hero-top">
            <div>
              <p class="eyebrow-jp">స్వర ・ AI వాయిస్ ఉద్యోగి</p>
              <h1>Hi, I'm Swara.</h1>
              <p>I call your leads the moment they arrive — in Hindi, Telugu, Tamil, Kannada, Malayalam, Marathi, Gujarati, Bengali, Punjabi, or English — qualify them like your best salesperson, and hand your team a ready-to-close appointment before a human even picks up the phone.</p>
              <div class="trust-chips">
                <span>Made in India</span>
                <span>10 Indian languages</span>
                <span>Natural, human-sounding voice</span>
              </div>
            </div>
            <div class="hero-bird" data-slot="hero-bird"></div>
          </div>
          <div class="dots"><span class="on"></span><span></span><span></span></div>

          <form class="waitlist-form" id="waitlist" novalidate>
            <div id="form-body">
              <div class="field-group">
                <input type="text" id="name" name="name" placeholder="Your name" autocomplete="name" required/>
                <input type="email" id="email" name="email" placeholder="you@business.com" required autocomplete="email"/>
                <select id="use-case" name="use_case" required>
                  <option value="" disabled selected>What will you use Swara for?</option>
                  <option value="real_estate">Real estate lead follow-up</option>
                  <option value="admissions">Admissions / coaching enquiries</option>
                  <option value="clinic">Clinic / diagnostics appointments</option>
                  <option value="ecommerce">E-commerce order & COD confirmation</option>
                  <option value="loans_insurance">Loans & insurance qualification</option>
                  <option value="recruitment">Recruitment screening calls</option>
                  <option value="restaurant_hotel">Restaurant / hotel bookings & orders</option>
                  <option value="support">Customer support / inbound</option>
                  <option value="other">Something else</option>
                </select>
                <input type="text" id="use-case-detail" name="use_case_detail" placeholder="Anything else you'd like to tell us? (optional)"/>
              </div>
              <button class="cta-btn full" type="submit" id="submit-btn">Join the waitlist</button>
              <p class="form-note">No spam. One email when Swara opens up early access.</p>
              <p class="waitlist-count" id="waitlist-count"></p>
              <p class="form-error" id="form-error" hidden></p>
            </div>
          </form>
        </section>

        <section class="how-it-works">
          <div class="section-head">
            <span class="eyebrow">HOW IT WORKS</span>
            <h2>From new lead to booked meeting, in one call.</h2>
          </div>
          <div class="steps-row">
            <div class="step-card">
              <span class="step-num">1</span>
              <h3>A lead arrives</h3>
              <p>From Meta, Google, your website, or a spreadsheet upload — Swara sees it the second it lands.</p>
            </div>
            <div class="step-arrow">→</div>
            <div class="step-card">
              <span class="step-num">2</span>
              <h3>Swara calls, in seconds</h3>
              <p>Answers in the caller's own language, follows your exact script, and handles objections naturally.</p>
            </div>
            <div class="step-arrow">→</div>
            <div class="step-card">
              <span class="step-num">3</span>
              <h3>Your team gets the outcome</h3>
              <p>Appointment booked, summary written, and a WhatsApp or calendar invite sent — automatically.</p>
            </div>
          </div>
        </section>

        <section class="industries">
          <div class="section-head">
            <span class="eyebrow">WHO IT'S FOR</span>
            <h2>Built for how Indian businesses actually sell.</h2>
          </div>
          <div class="industry-grid">
            <div class="industry-card"><span class="ind-icon">🏢</span><strong>Real estate & builders</strong><p>Qualify site-visit leads before they go cold.</p></div>
            <div class="industry-card"><span class="ind-icon">🎓</span><strong>Coaching & admissions</strong><p>Answer every enquiry, even at 11pm.</p></div>
            <div class="industry-card"><span class="ind-icon">🩺</span><strong>Clinics & diagnostics</strong><p>Confirm appointments, cut no-shows.</p></div>
            <div class="industry-card"><span class="ind-icon">🛍️</span><strong>E-commerce & D2C</strong><p>Confirm COD orders before they're shipped.</p></div>
            <div class="industry-card"><span class="ind-icon">💳</span><strong>Loans & insurance</strong><p>Qualify applicants at the speed they apply.</p></div>
            <div class="industry-card"><span class="ind-icon">👥</span><strong>Recruitment</strong><p>Screen candidates in bulk, same day.</p></div>
            <div class="industry-card"><span class="ind-icon">🍽️</span><strong>Restaurants & hotels</strong><p>Take table bookings, food orders, and cancellations round the clock.</p></div>
          </div>
        </section>

        <section class="features">
          <div class="section-head">
            <span class="eyebrow">WHAT MAKES SWARA DIFFERENT</span>
            <h2>Not a robotic IVR. Not a call centre.</h2>
          </div>
          <div class="feature-grid">
            <div class="feature-card"><span class="feat-icon">🗣️</span><strong>Natural code-switching</strong><p>Speaks the Telugu-English or Hindi-English mix your customers actually use.</p></div>
            <div class="feature-card"><span class="feat-icon">⚡</span><strong>Answers in seconds</strong><p>No lead sits waiting. Swara dials the moment it arrives, any hour.</p></div>
            <div class="feature-card"><span class="feat-icon">🧠</span><strong>Remembers the whole call</strong><p>Tracks budget, objections, and preferences without asking twice.</p></div>
            <div class="feature-card"><span class="feat-icon">📅</span><strong>WhatsApp & Calendar built in</strong><p>Confirmations and invites go out the moment a slot is booked.</p></div>
            <div class="feature-card"><span class="feat-icon">📝</span><strong>Every call, transcribed</strong><p>Full transcript and outcome summary land in your dashboard automatically.</p></div>
            <div class="feature-card"><span class="feat-icon">🎛️</span><strong>You write the script</strong><p>Edit exactly what Swara says from a simple dashboard — no code.</p></div>
          </div>
        </section>

        <section class="compare">
          <div class="section-head">
            <span class="eyebrow">THE MATH</span>
            <h2>How Swara stacks up against the alternatives.</h2>
          </div>
          <div class="compare-table-wrap">
            <table class="compare-table">
              <thead>
                <tr><th></th><th class="col-swara">Swara</th><th>Human telecaller</th><th>Generic AI caller</th></tr>
              </thead>
              <tbody>
                <tr><td>Speed to lead</td><td class="col-swara">Seconds</td><td>Hours, if at all</td><td>Minutes</td></tr>
                <tr><td>Availability</td><td class="col-swara">24×7</td><td>Business hours</td><td>24×7</td></tr>
                <tr><td>Indian languages</td><td class="col-swara">Native code-switching</td><td>Depends on hire</td><td>Usually English-only</td></tr>
                <tr><td>Time to hire / deploy</td><td class="col-swara">Minutes</td><td>Weeks</td><td>Days</td></tr>
                <tr><td>Consistency</td><td class="col-swara">Same script, every call</td><td>Varies by mood, day</td><td>Often robotic</td></tr>
                <tr><td>Cost</td><td class="col-swara">A fraction of a salary</td><td>Full-time salary + attrition</td><td>Per-minute, opaque</td></tr>
              </tbody>
            </table>
          </div>
        </section>

        <section class="perks-section">
          <div class="section-head">
            <span class="eyebrow">FOUNDING MEMBERS</span>
            <h2>Join now, and launch on us.</h2>
          </div>
          <div class="perks-grid">
            <div class="perk-card"><span class="perk-icon">🎁</span><strong>Free setup & infrastructure</strong><p>Zero setup cost — we configure everything for you.</p></div>
            <div class="perk-card"><span class="perk-icon">📞</span><strong>Free calling credits</strong><p>Outbound and inbound call credits to get started, on us.</p></div>
            <div class="perk-card"><span class="perk-icon">🧑‍💼</span><strong>Your first AI employee, free</strong><p>We build and configure your first employee at no cost.</p></div>
            <div class="perk-card"><span class="perk-icon">💬</span><strong>Free WhatsApp & Calendar integration</strong><p>Confirmations and bookings connected from day one.</p></div>
            <div class="perk-card"><span class="perk-icon">🏷️</span><strong>Founding-member pricing</strong><p>Locked-in discounts and privileges, for as long as you stay.</p></div>
            <div class="perk-card"><span class="perk-icon">🛟</span><strong>Priority, on-time support</strong><p>A direct line to the team — not a ticket queue.</p></div>
          </div>
        </section>

        <section class="faq">
          <div class="section-head">
            <span class="eyebrow">A FEW ANSWERS</span>
            <h2>Questions people usually ask.</h2>
          </div>
          <div class="faq-list">
            <details class="faq-item" open>
              <summary>What exactly is Swara?</summary>
              <p>An AI voice employee that calls your leads on the phone — not a chatbot. It speaks, listens, and responds in real time, following the script you give it.</p>
            </details>
            <details class="faq-item">
              <summary>Which languages does it speak?</summary>
              <p>Hindi, Telugu, Tamil, Kannada, Malayalam, Marathi, Gujarati, Bengali, Punjabi, and English — including natural code-switching between English and a regional language, the way people actually talk on the phone.</p>
            </details>
            <details class="faq-item">
              <summary>How fast does it actually call?</summary>
              <p>The moment a lead lands — from an ad, a form, or a CRM — Swara can start dialling within seconds, day or night.</p>
            </details>
            <details class="faq-item">
              <summary>Does it sound robotic?</summary>
              <p>No. Swara runs on Indian-language speech models tuned for natural, conversational delivery rather than a flat text-to-speech voice.</p>
            </details>
            <details class="faq-item">
              <summary>What do I get for joining the waitlist?</summary>
              <p>Founding-member perks — free setup, free calling credits, your first employee built for free, and priority support — plus first access when early availability opens.</p>
            </details>
            <details class="faq-item">
              <summary>When does it launch?</summary>
              <p>Early access opens in phases, starting with the founding-member waitlist. Join now to be called first.</p>
            </details>
          </div>
        </section>

        <section class="final-cta">
          <div class="final-cta-inner">
            <div>
              <h2>Don't let another lead go cold.</h2>
              <p>Join the founding-member waitlist — it takes 20 seconds.</p>
            </div>
            <button id="scroll-to-form" type="button" class="cta-btn light">Join the waitlist →</button>
          </div>
        </section>

        <div data-slot="footer"></div>
      </div>
    </template>
